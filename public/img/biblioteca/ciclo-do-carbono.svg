<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" fill="#0B1220"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34D399"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FB7185"/>
    </marker>
  </defs>

  <text x="40" y="40" fill="#E5E7EB" font-size="18" font-weight="600">Ciclo do carbono</text>

  <!-- atmosfera -->
  <rect x="270" y="60" width="260" height="52" rx="8" fill="#3B82F6" fill-opacity="0.18" stroke="#3B82F6"/>
  <text x="400" y="92" fill="#E5E7EB" font-size="14" font-weight="600" text-anchor="middle">Atmosfera — CO₂</text>

  <!-- caixas -->
  <g font-size="12.5" fill="#E5E7EB" text-anchor="middle">
    <rect x="70" y="200" width="150" height="48" rx="8" fill="#16223A" stroke="#334155"/><text x="145" y="229">Vegetação</text>
    <rect x="325" y="290" width="150" height="48" rx="8" fill="#16223A" stroke="#334155"/><text x="400" y="319">Animais · solo</text>
    <rect x="580" y="200" width="150" height="48" rx="8" fill="#16223A" stroke="#334155"/><text x="655" y="219">Oceano</text>
    <text x="655" y="238" font-size="10" fill="#94A3B8">acidificação</text>
    <rect x="70" y="320" width="150" height="44" rx="8" fill="#2A1720" stroke="#7F1D2E"/><text x="145" y="347">Combustível fóssil</text>
    <rect x="560" y="320" width="180" height="44" rx="8" fill="#16223A" stroke="#334155"/><text x="650" y="347">Indústria · transporte</text>
  </g>

  <!-- fluxos -->
  <path d="M330,112 C260,150 180,165 150,198" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#g)"/>
  <text x="210" y="150" fill="#34D399" font-size="11">fotossíntese</text>

  <path d="M175,200 C200,165 250,140 320,114" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="235" y="182" fill="#94A3B8" font-size="10.5">respiração</text>

  <path d="M400,290 L400,116" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="408" y="210" fill="#94A3B8" font-size="10.5">respiração / decomposição</text>

  <path d="M145,320 L145,250" fill="none" stroke="#FB7185" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M650,320 C640,240 560,150 470,110" fill="none" stroke="#FB7185" stroke-width="2" marker-end="url(#r)"/>
  <text x="560" y="250" fill="#FB7185" font-size="11">combustão</text>

  <path d="M530,90 C560,120 590,160 640,200" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M655,200 C610,160 560,120 532,96" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="600" y="150" fill="#94A3B8" font-size="10.5">trocas</text>

  <text x="40" y="386" fill="#64748B" font-size="11">Verde = retira CO₂ · cinza = devolve no ciclo natural · vermelho = devolve rápido carbono que estava fora de circulação.</text>
</svg>
