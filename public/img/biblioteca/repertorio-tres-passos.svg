<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="200" fill="#0B1220"/>
  <text x="40" y="38" fill="#E5E7EB" font-size="18" font-weight="600">Repertório produtivo em 3 passos</text>

  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60A5FA"/></marker></defs>

  <g text-anchor="middle" font-size="12">
    <rect x="50" y="80" width="200" height="70" rx="10" fill="#16223A" stroke="#334155"/>
    <text x="150" y="108" fill="#E5E7EB" font-weight="600">1 · Apresentar</text>
    <text x="150" y="128" fill="#94A3B8" font-size="11">nomear a referência</text>

    <rect x="300" y="80" width="200" height="70" rx="10" fill="#16223A" stroke="#334155"/>
    <text x="400" y="108" fill="#E5E7EB" font-weight="600">2 · Explicar</text>
    <text x="400" y="128" fill="#94A3B8" font-size="11">mostrar que domina</text>

    <rect x="550" y="80" width="200" height="70" rx="10" fill="#3B82F6" fill-opacity="0.18" stroke="#3B82F6"/>
    <text x="650" y="108" fill="#E5E7EB" font-weight="600">3 · Conectar</text>
    <text x="650" y="128" fill="#94A3B8" font-size="11">elo explícito com a tese</text>
  </g>

  <line x1="252" y1="115" x2="298" y2="115" stroke="#60A5FA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="502" y1="115" x2="548" y2="115" stroke="#60A5FA" stroke-width="2" marker-end="url(#ar)"/>

  <text x="40" y="182" fill="#64748B" font-size="11">Sem o passo 3, o repertório vira "enfeite" e não pontua na Competência 2.</text>
</svg>
